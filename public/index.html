<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoliSeguimiento — Incremento 1</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="card">
    <h1>Consulta el estado de tu solicitud</h1>
    <p class="sub">Incremento 1 — ejemplo: POL-2026-0417 o POL-2026-0512</p>
    <div class="row">
      <input id="radicado" placeholder="Ej. POL-2026-0417" />
      <button onclick="consultar()">Consultar</button>
    </div>
    <div id="resultado"></div>
    <p class="hint">Datos de prueba (mock) para el Incremento 1. La integración con Registro Académico queda para una iteración posterior.</p>
  </div>

  <script>
    async function consultar() {
      const radicado = document.getElementById('radicado').value.trim();
      const div = document.getElementById('resultado');
      div.innerHTML = 'Consultando...';
      try {
        const res = await fetch('/api/solicitudes/' + encodeURIComponent(radicado));
        const data = await res.json();
        if (!res.ok) {
          div.innerHTML = '<p class="error">' + data.mensaje + '</p>';
          return;
        }
        const t = data.tiempo;
        const tiempoHtml = t.retrasada
          ? `<div class="tiempo-box alerta">⚠ Esta solicitud lleva ${t.diasHabilesTranscurridos} días hábiles, por encima de los ${t.diasHabilesEsperados} días esperados para este certificado.</div>`
          : `<div class="tiempo-box ok">Tiempo transcurrido: ${t.diasHabilesTranscurridos} de ${t.diasHabilesEsperados} días hábiles esperados.</div>`;

        const claseBadge = { pendiente: 'pendiente', trasladada: 'trasladada', 'en revision': 'revision' }[data.estado] || 'revision';

        div.innerHTML = `
          <p><strong>${data.nombreCertificado}</strong><br>
          Radicado ${data.radicado} · Costo 2026: ${data.costo}
          <span class="badge ${claseBadge}">${data.estado}</span></p>
          <p><strong>Área actual:</strong> ${data.areaActual}</p>
          <p>${data.descripcionArea}</p>
          ${tiempoHtml}
          <div class="historial">
            <h3>Historial de movimientos</h3>
            <ul>
              ${data.historial.map(h => `<li><strong>${h.area}</strong><br>
                <span class="fecha">${h.fecha}</span> — ${h.accion}</li>`).join('')}
            </ul>
          </div>
        `;
      } catch (e) {
        div.innerHTML = '<p class="error">Ocurrió un error al consultar. Intenta de nuevo.</p>';
      }
    }
  </script>
</body>
</html>
